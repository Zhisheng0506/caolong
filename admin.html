<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 湖口草龙博物馆</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#5d4037',
                        secondary: '#d32f2f',
                        accent: '#f8f0e3',
                        neutral: '#f5f5f5',
                    },
                    fontFamily: {
                        sans: ['SimHei', 'sans-serif'],
                        serif: ['SimSun', 'serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body { animation: pageFadeIn 0.4s ease; }
        @keyframes pageFadeIn { from { opacity: 0; } to { opacity: 1; } }

        .tab-btn { transition: all 0.2s; }
        .tab-btn.active { background-color: #d32f2f; color: white; }

        .data-table th { white-space: nowrap; }
        .data-table td { max-width: 250px; word-break: break-all; }

        @media (max-width: 768px) {
            .data-table { font-size: 0.75rem; }
            .data-table th, .data-table td { padding: 0.5rem 0.25rem; }
        }
    </style>
</head>
<body class="bg-accent text-primary min-h-screen">
    <!-- 导航栏 -->
    <nav class="sticky top-0 z-50 bg-primary/95 backdrop-blur-sm shadow-md">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <a href="/" class="text-white text-xl font-bold tracking-wider hover:text-yellow-300 transition-colors">
                    <i class="fa fa-dragon mr-2 text-secondary"></i>湖口草龙博物馆
                </a>
                <div class="flex items-center gap-4">
                    <span class="text-white/70 text-sm hidden sm:inline">后台管理</span>
                    <a href="/" class="text-white hover:text-yellow-300 transition-colors text-sm">
                        <i class="fa fa-home mr-1"></i>回到首页
                    </a>
                    <button id="btn-refresh" class="text-white hover:text-yellow-300 transition-colors" title="刷新数据">
                        <i class="fa fa-refresh"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        <!-- 页面标题 -->
        <div class="text-center mb-8">
            <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-bold text-primary mb-2">
                <i class="fa fa-database text-secondary mr-3"></i>数据管理后台
            </h1>
            <p class="text-gray-600">查看前端表单提交的所有报名和预约数据</p>
        </div>

        <!-- 统计卡片 -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 max-w-4xl mx-auto mb-10">
            <div class="bg-white rounded-xl shadow-md p-6 text-center transition-all duration-300 hover:shadow-lg">
                <div class="text-4xl font-bold text-secondary mb-1" id="stat-craft">--</div>
                <div class="text-gray-600 text-sm">工艺体验报名</div>
            </div>
            <div class="bg-white rounded-xl shadow-md p-6 text-center transition-all duration-300 hover:shadow-lg">
                <div class="text-4xl font-bold text-secondary mb-1" id="stat-booking">--</div>
                <div class="text-gray-600 text-sm">展览参观预约</div>
            </div>
            <div class="bg-white rounded-xl shadow-md p-6 text-center transition-all duration-300 hover:shadow-lg">
                <div class="text-4xl font-bold text-secondary mb-1" id="stat-order">--</div>
                <div class="text-gray-600 text-sm">文创订单</div>
            </div>
        </div>

        <!-- 标签切换 -->
        <div class="flex justify-center mb-6">
            <div class="inline-flex bg-white rounded-lg shadow-md p-1">
                <button class="tab-btn active px-6 py-2 rounded-md font-medium text-sm transition-all" data-tab="craft">
                    <i class="fa fa-paint-brush mr-1"></i>工艺体验报名
                </button>
                <button class="tab-btn px-6 py-2 rounded-md font-medium text-sm transition-all" data-tab="booking">
                    <i class="fa fa-calendar-check mr-1"></i>展览参观预约
                </button>
                <button class="tab-btn px-6 py-2 rounded-md font-medium text-sm transition-all" data-tab="order">
                    <i class="fa fa-shopping-cart mr-1"></i>文创订单
                </button>
            </div>
        </div>

        <!-- 加载状态 -->
        <div id="loading-indicator" class="text-center py-12">
            <i class="fa fa-spinner fa-spin text-3xl text-primary/40"></i>
            <p class="text-gray-500 mt-3">加载中...</p>
        </div>

        <!-- 错误状态 -->
        <div id="error-indicator" class="hidden text-center py-12">
            <i class="fa fa-exclamation-triangle text-3xl text-red-400"></i>
            <p class="text-red-600 mt-3" id="error-message"></p>
            <button class="mt-4 bg-secondary text-white px-6 py-2 rounded-lg hover:bg-secondary/90 transition-colors" onclick="loadData()">
                <i class="fa fa-refresh mr-1"></i>重试
            </button>
        </div>

        <!-- 工艺体验报名表格 -->
        <div id="tab-craft" class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table class="data-table w-full text-left">
                    <thead class="bg-primary text-white text-sm">
                        <tr>
                            <th class="px-4 py-3">#</th>
                            <th class="px-4 py-3">姓名</th>
                            <th class="px-4 py-3">邮箱</th>
                            <th class="px-4 py-3">手机号</th>
                            <th class="px-4 py-3">留言内容</th>
                            <th class="px-4 py-3">提交时间</th>
                            <th class="px-4 py-3 w-16">操作</th>
                        </tr>
                    </thead>
                    <tbody id="craft-tbody" class="divide-y divide-gray-100 text-sm"></tbody>
                </table>
            </div>
            <div id="craft-empty" class="hidden text-center py-12 text-gray-400">
                <i class="fa fa-inbox text-4xl mb-2"></i>
                <p>暂无数据</p>
            </div>
        </div>

        <!-- 展览参观预约表格 -->
        <div id="tab-booking" class="hidden bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table class="data-table w-full text-left">
                    <thead class="bg-primary text-white text-sm">
                        <tr>
                            <th class="px-4 py-3">#</th>
                            <th class="px-4 py-3">姓名</th>
                            <th class="px-4 py-3">手机号</th>
                            <th class="px-4 py-3">参观日期</th>
                            <th class="px-4 py-3">参观人数</th>
                            <th class="px-4 py-3">提交时间</th>
                            <th class="px-4 py-3 w-16">操作</th>
                        </tr>
                    </thead>
                    <tbody id="booking-tbody" class="divide-y divide-gray-100 text-sm"></tbody>
                </table>
            </div>
            <div id="booking-empty" class="hidden text-center py-12 text-gray-400">
                <i class="fa fa-inbox text-4xl mb-2"></i>
                <p>暂无数据</p>
            </div>
        </div>

        <!-- 文创订单表格 -->
        <div id="tab-order" class="hidden bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table class="data-table w-full text-left">
                    <thead class="bg-primary text-white text-sm">
                        <tr>
                            <th class="px-4 py-3">#</th>
                            <th class="px-4 py-3">商品</th>
                            <th class="px-4 py-3">单价</th>
                            <th class="px-4 py-3">数量</th>
                            <th class="px-4 py-3">收货人</th>
                            <th class="px-4 py-3">手机号</th>
                            <th class="px-4 py-3">地址</th>
                            <th class="px-4 py-3">时间</th>
                            <th class="px-4 py-3 w-16">操作</th>
                        </tr>
                    </thead>
                    <tbody id="order-tbody" class="divide-y divide-gray-100 text-sm"></tbody>
                </table>
            </div>
            <div id="order-empty" class="hidden text-center py-12 text-gray-400">
                <i class="fa fa-inbox text-4xl mb-2"></i>
                <p>暂无订单</p>
            </div>
        </div>
    </main>

    <footer class="bg-primary text-white/60 text-center py-4 text-sm mt-12">
        <p>&copy; 2025 湖口草龙博物馆. 后台管理系统</p>
    </footer>

    <script>
    var currentTab = 'craft';
    var craftData = [];
    var bookingData = [];
    var orderData = [];

    // ---- 标签切换 ----
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            this.classList.add('active');
            currentTab = this.dataset.tab;
            showTab(currentTab);
        });
    });

    function showTab(tab) {
        document.getElementById('tab-craft').classList.toggle('hidden', tab !== 'craft');
        document.getElementById('tab-booking').classList.toggle('hidden', tab !== 'booking');
        document.getElementById('tab-order').classList.toggle('hidden', tab !== 'order');
    }

    // ---- 加载数据 ----
    function loadData() {
        document.getElementById('loading-indicator').classList.remove('hidden');
        document.getElementById('error-indicator').classList.add('hidden');
        document.getElementById('tab-craft').classList.add('hidden');
        document.getElementById('tab-booking').classList.add('hidden');
        document.getElementById('tab-order').classList.add('hidden');

        Promise.all([
            fetch('/api/craft-registrations').then(function(r) { return r.json(); }),
            fetch('/api/exhibition-bookings').then(function(r) { return r.json(); }),
            fetch('/api/orders').then(function(r) { return r.json(); })
        ])
        .then(function(results) {
            document.getElementById('loading-indicator').classList.add('hidden');

            var craftRes = results[0];
            var bookingRes = results[1];
            var orderRes = results[2];

            if (!craftRes.success || !bookingRes.success || !orderRes.success) {
                showError('数据加载失败，请重试。');
                return;
            }

            craftData = craftRes.data;
            bookingData = bookingRes.data;
            orderData = orderRes.data;

            // 统计
            document.getElementById('stat-craft').textContent = craftData.length;
            document.getElementById('stat-booking').textContent = bookingData.length;
            document.getElementById('stat-order').textContent = orderData.length;

            // 渲染表格
            renderCraftTable(craftData);
            renderBookingTable(bookingData);
            renderOrderTable(orderData);

            // 显示当前标签
            showTab(currentTab);
        })
        .catch(function(err) {
            document.getElementById('loading-indicator').classList.add('hidden');
            showError('网络错误，请确认服务器已启动。');
            console.error('Fetch error:', err);
        });
    }

    function showError(msg) {
        document.getElementById('error-message').textContent = msg;
        document.getElementById('error-indicator').classList.remove('hidden');
    }

    // ---- 渲染工艺报名表格 ----
    function renderCraftTable(data) {
        var tbody = document.getElementById('craft-tbody');
        var empty = document.getElementById('craft-empty');
        tbody.innerHTML = '';

        if (data.length === 0) {
            empty.classList.remove('hidden');
            return;
        }
        empty.classList.add('hidden');

        data.forEach(function(row, i) {
            var tr = document.createElement('tr');
            tr.className = 'hover:bg-gray-50 transition-colors';
            tr.innerHTML =
                '<td class="px-4 py-3 text-gray-400">' + (data.length - i) + '</td>' +
                '<td class="px-4 py-3 font-medium">' + esc(row.name) + '</td>' +
                '<td class="px-4 py-3 text-gray-600">' + esc(row.email) + '</td>' +
                '<td class="px-4 py-3 text-gray-600">' + esc(row.phone) + '</td>' +
                '<td class="px-4 py-3 text-gray-600">' + (row.message ? esc(row.message) : '<span class="text-gray-300">-</span>') + '</td>' +
                '<td class="px-4 py-3 text-gray-500 text-xs">' + esc(row.created_at) + '</td>' +
                '<td class="px-4 py-3"><button class="text-red-500 hover:text-red-700 hover:bg-red-50 rounded p-1 transition-colors" title="删除" onclick="deleteRow(\'craft\',' + row.id + ')"><i class="fa fa-trash"></i></button></td>';
            tbody.appendChild(tr);
        });
    }

    // ---- 渲染预约表格 ----
    function renderBookingTable(data) {
        var tbody = document.getElementById('booking-tbody');
        var empty = document.getElementById('booking-empty');
        tbody.innerHTML = '';

        if (data.length === 0) {
            empty.classList.remove('hidden');
            return;
        }
        empty.classList.add('hidden');

        data.forEach(function(row, i) {
            var tr = document.createElement('tr');
            tr.className = 'hover:bg-gray-50 transition-colors';
            tr.innerHTML =
                '<td class="px-4 py-3 text-gray-400">' + (data.length - i) + '</td>' +
                '<td class="px-4 py-3 font-medium">' + esc(row.name) + '</td>' +
                '<td class="px-4 py-3 text-gray-600">' + esc(row.phone) + '</td>' +
                '<td class="px-4 py-3 text-gray-600">' + esc(row.visit_date) + '</td>' +
                '<td class="px-4 py-3 text-gray-600">' + row.number_of_people + ' 人</td>' +
                '<td class="px-4 py-3 text-gray-500 text-xs">' + esc(row.created_at) + '</td>' +
                '<td class="px-4 py-3"><button class="text-red-500 hover:text-red-700 hover:bg-red-50 rounded p-1 transition-colors" title="删除" onclick="deleteRow(\'booking\',' + row.id + ')"><i class="fa fa-trash"></i></button></td>';
            tbody.appendChild(tr);
        });
    }

    // ---- 渲染订单表格 ----
    function renderOrderTable(data) {
        var tbody = document.getElementById('order-tbody');
        var empty = document.getElementById('order-empty');
        tbody.innerHTML = '';

        if (data.length === 0) {
            empty.classList.remove('hidden');
            return;
        }
        empty.classList.add('hidden');

        data.forEach(function(row, i) {
            var tr = document.createElement('tr');
            tr.className = 'hover:bg-gray-50 transition-colors';
            tr.innerHTML =
                '<td class="px-4 py-3 text-gray-400">' + (data.length - i) + '</td>' +
                '<td class="px-4 py-3 font-medium">' + esc(row.product_name) + '</td>' +
                '<td class="px-4 py-3 text-secondary font-medium">¥' + row.price + '</td>' +
                '<td class="px-4 py-3 text-gray-600">' + row.quantity + '</td>' +
                '<td class="px-4 py-3 text-gray-600">' + esc(row.customer_name) + '</td>' +
                '<td class="px-4 py-3 text-gray-600">' + esc(row.phone) + '</td>' +
                '<td class="px-4 py-3 text-gray-600">' + esc(row.address) + '</td>' +
                '<td class="px-4 py-3 text-gray-500 text-xs">' + esc(row.created_at) + '</td>' +
                '<td class="px-4 py-3"><button class="text-red-500 hover:text-red-700 hover:bg-red-50 rounded p-1 transition-colors" title="删除" onclick="deleteRow(\'order\',' + row.id + ')"><i class="fa fa-trash"></i></button></td>';
            tbody.appendChild(tr);
        });
    }

    // ---- HTML 转义 ----
    function esc(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // ---- 删除数据 ----
    window.deleteRow = function(type, id) {
        if (!confirm('确定要删除这条记录吗？此操作不可撤销。')) return;

        var apiPath;
        if (type === 'craft') apiPath = '/api/craft-registrations/' + id;
        else if (type === 'booking') apiPath = '/api/exhibition-bookings/' + id;
        else apiPath = '/api/orders/' + id;

        fetch(apiPath, { method: 'DELETE' })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.success) {
                    loadData();  // 重新加载数据
                } else {
                    alert('删除失败：' + (data.message || '未知错误'));
                }
            })
            .catch(function(err) {
                alert('网络错误，删除失败');
                console.error('Delete error:', err);
            });
    };

    // ---- 刷新按钮 ----
    document.getElementById('btn-refresh').addEventListener('click', function() {
        this.classList.add('fa-spin');
        loadData().finally(function() {
            setTimeout(function() {
                document.getElementById('btn-refresh').classList.remove('fa-spin');
            }, 500);
        });
    });

    // ---- 页面加载 ----
    loadData();
    </script>
</body>
</html>
