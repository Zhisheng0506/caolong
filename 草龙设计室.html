    // ============================================
    // Initialize Fabric.js Canvas
    // ============================================
    var canvas;
    var currentColor = '#d32f2f';
    var currentTool = 'select';
    var stateStack = [];
    var stateIndex = -1;
    var isSavingState = false;

    function initCanvas() {
        var wrapper = document.getElementById('canvas-wrapper');
        var w = wrapper.clientWidth - 32;
        var h = wrapper.clientHeight - 32;

        canvas = new fabric.Canvas('design-canvas', {
            width: w,
            height: h,
            backgroundColor: '#f8f0e3',
            selection: true
        });

        // Save initial state
        saveState();

        // Events for undo/redo
        canvas.on('object:modified', function() { saveState(); });
        canvas.on('object:added', function() { if (!isSavingState) saveState(); });
        canvas.on('object:removed', function() { saveState(); });
    }

    // ============================================
    // Undo / Redo
    // ============================================
    function saveState() {
        isSavingState = true;
        stateStack = stateStack.slice(0, stateIndex + 1);
        stateStack.push(JSON.stringify(canvas));
        stateIndex++;
        if (stateStack.length > 30) {
            stateStack.shift();
            stateIndex--;
        }
        updateUndoRedoButtons();
        updateObjectCount();
        isSavingState = false;
    }

    function undo() {
        if (stateIndex <= 0) return;
        stateIndex--;
        loadState(stateStack[stateIndex]);
    }

    function redo() {
        if (stateIndex >= stateStack.length - 1) return;
        stateIndex++;
        loadState(stateStack[stateIndex]);
    }

    function loadState(json) {
        isSavingState = true;
        canvas.loadFromJSON(json, function() {
            canvas.renderAll();
            updateUndoRedoButtons();
            updateObjectCount();
            isSavingState = false;
        });
    }

    function updateUndoRedoButtons() {
        document.getElementById('btn-undo').disabled = stateIndex <= 0;
        document.getElementById('btn-redo').disabled = stateIndex >= stateStack.length - 1;
    }

    function updateObjectCount() {
        var count = canvas.getObjects().length;
        document.getElementById('object-count').textContent = '画布对象: ' + count;
    }

    // ============================================
    // Tool Switching
    // ============================================
    function setTool(tool) {
        currentTool = tool;
        canvas.isDrawingMode = false;
        document.querySelectorAll('.tool-btn[data-tool]').forEach(function(b) {
            b.classList.toggle('active', b.dataset.tool === tool);
        });
        document.getElementById('brush-settings').classList.toggle('hidden', tool !== 'brush');

        switch(tool) {
            case 'select':
                canvas.selection = true;
                canvas.defaultCursor = 'default';
                break;
            case 'brush':
                canvas.isDrawingMode = true;
                canvas.freeDrawingBrush.color = currentColor;
                canvas.freeDrawingBrush.width = parseInt(document.getElementById('brush-size').value);
                break;
            case 'text':
                canvas.selection = false;
                canvas.defaultCursor = 'text';
                break;
            case 'eraser':
                canvas.selection = true;
                canvas.defaultCursor = 'pointer';
                break;
            case 'duplicate':
                var active = canvas.getActiveObject();
                if (active) {
                    active.clone(function(cloned) {
                        cloned.set({ left: active.left + 20, top: active.top + 20 });
                        canvas.add(cloned);
                        canvas.setActiveObject(cloned);
                        canvas.renderAll();
                    });
                }
                setTool('select');
                break;
        }
    }

    // ============================================
    // Color Handling
    // ============================================
    function setColor(color) {
        currentColor = color;
        document.querySelectorAll('.color-swatch').forEach(function(s) {
            s.classList.toggle('active', s.dataset.color === color);
        });
        document.getElementById('custom-color').value = color;
        if (canvas.isDrawingMode) {
            canvas.freeDrawingBrush.color = color;
        }
        var active = canvas.getActiveObject();
        if (active) {
            if (active.type === 'i-text' || active.type === 'text') {
                active.set('fill', color);
            } else {
                active.set('fill', color);
            }
            canvas.renderAll();
            saveState();
        }
    }

    // ============================================
    // Add Dragon Part to Canvas
    // ============================================
    function addPartToCanvas(svgString, scale) {
        scale = scale || 0.8;
        fabric.loadSVGFromString(svgString, function(objects, options) {
            var obj = fabric.util.groupSVGElements(objects, options);
            obj.scaleToWidth(150 * scale);
            obj.set({
                left: canvas.width / 2 - 50 + Math.random() * 100,
                top: canvas.height / 2 - 50 + Math.random() * 80,
                cornerColor: '#d32f2f',
                cornerSize: 10,
                transparentCorners: false,
                cornerStyle: 'circle'
            });
            canvas.add(obj);
            canvas.setActiveObject(obj);
            canvas.renderAll();
        });
    }

    // ============================================
    // Populate Sidebar Parts
    // ============================================
    function populateParts() {
        var bodyContainer = document.getElementById('dragon-body-parts');
        DRAGON_BODY.forEach(function(part) {
            var div = document.createElement('div');
            div.className = 'part-item rounded-lg border border-primary/10 p-2 text-center';
            div.innerHTML = '<div class="text-2xl mb-1">' + part.icon + '</div><div class="text-xs text-primary/70 truncate">' + part.name + '</div>';
            div.title = part.name;
            div.addEventListener('click', function() { addPartToCanvas(part.svg); });
            bodyContainer.appendChild(div);
        });

        var decoContainer = document.getElementById('decoration-parts');
        DECORATIONS.forEach(function(part) {
            var div = document.createElement('div');
            div.className = 'part-item rounded-lg border border-primary/10 p-2 text-center';
            div.innerHTML = '<div class="text-2xl mb-1">' + part.icon + '</div><div class="text-xs text-primary/70 truncate">' + part.name + '</div>';
            div.title = part.name;
            div.addEventListener('click', function() { addPartToCanvas(part.svg, 0.6); });
            decoContainer.appendChild(div);
        });
    }

    // ============================================
    // Background Switching
    // ============================================
    function setBackground(type) {
        document.querySelectorAll('.bg-option').forEach(function(o) {
            o.classList.toggle('active', o.dataset.bg === type);
        });
        switch(type) {
            case '#f8f0e3':
                canvas.setBackgroundColor('#f8f0e3', canvas.renderAll.bind(canvas));
                break;
            case 'xuanzhi':
                canvas.setBackgroundColor('#f0e6d0', canvas.renderAll.bind(canvas));
                // Add texture via a pattern
                var patternCanvas = document.createElement('canvas');
                patternCanvas.width = 200; patternCanvas.height = 200;
                var pctx = patternCanvas.getContext('2d');
                pctx.fillStyle = '#f0e6d0';
                pctx.fillRect(0, 0, 200, 200);
                for (var i = 0; i < 500; i++) {
                    pctx.fillStyle = 'rgba(93,64,55,' + (Math.random() * 0.04) + ')';
                    pctx.fillRect(Math.random()*200, Math.random()*200, Math.random()*3+1, Math.random()*3+1);
                }
                var pattern = new fabric.Pattern({ source: patternCanvas, repeat: 'repeat' });
                canvas.setBackgroundColor(pattern, canvas.renderAll.bind(canvas));
                break;
            case 'nightsky':
                var grad = new fabric.Gradient({
                    type: 'linear',
                    coords: { x1: 0, y1: 0, x2: 0, y2: canvas.height },
                    colorStops: [
                        { offset: 0, color: '#0d1b2a' },
                        { offset: 0.5, color: '#1b2838' },
                        { offset: 1, color: '#2d3a4a' }
                    ]
                });
                canvas.setBackgroundColor(grad, canvas.renderAll.bind(canvas));
                // Add stars
                for (var s = 0; s < 30; s++) {
                    var star = new fabric.Circle({
                        radius: Math.random() * 2 + 0.5,
                        fill: 'white',
                        left: Math.random() * canvas.width,
                        top: Math.random() * canvas.height,
                        opacity: Math.random() * 0.7 + 0.3,
                        selectable: false, evented: false
                    });
                    canvas.add(star);
                    canvas.sendToBack(star);
                }
                break;
            case 'stage':
                var grad2 = new fabric.Gradient({
                    type: 'radial',
                    coords: { x1: canvas.width/2, y1: canvas.height/2, x2: canvas.width/2, y2: canvas.height/2, r1: 0, r2: Math.max(canvas.width, canvas.height) * 0.7 },
                    colorStops: [
                        { offset: 0, color: '#c62828' },
                        { offset: 1, color: '#7f0000' }
                    ]
                });
                canvas.setBackgroundColor(grad2, canvas.renderAll.bind(canvas));
                break;
        }
        saveState();
    }

    // ============================================
    // Export
    // ============================================
    function exportImage() {
        canvas.discardActiveObject();
        canvas.renderAll();
        var dataURL = canvas.toDataURL({ format: 'png', quality: 1, multiplier: 2 });
        var link = document.createElement('a');
        link.download = '我的草龙设计.png';
        link.href = dataURL;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // ============================================
    // Event Bindings
    // ============================================
    function bindEvents() {
        // Tool buttons
        document.querySelectorAll('.tool-btn[data-tool]').forEach(function(btn) {
            btn.addEventListener('click', function() { setTool(this.dataset.tool); });
        });

        // Color swatches
        document.querySelectorAll('.color-swatch').forEach(function(swatch) {
            swatch.addEventListener('click', function() { setColor(this.dataset.color); });
        });
        document.getElementById('custom-color').addEventListener('input', function() {
            setColor(this.value);
        });

        // Brush size
        document.getElementById('brush-size').addEventListener('input', function() {
            document.getElementById('brush-size-val').textContent = this.value;
            if (canvas.freeDrawingBrush) {
                canvas.freeDrawingBrush.width = parseInt(this.value);
            }
        });

        // Background options
        document.querySelectorAll('.bg-option').forEach(function(opt) {
            opt.addEventListener('click', function() { setBackground(this.dataset.bg); });
        });

        // Undo / Redo
        document.getElementById('btn-undo').addEventListener('click', undo);
        document.getElementById('btn-redo').addEventListener('click', redo);

        // Clear
        document.getElementById('btn-clear').addEventListener('click', function() {
            if (canvas.getObjects().length > 0 && confirm('确定要清空画布吗？所有内容将被删除。')) {
                canvas.clear();
                canvas.setBackgroundColor('#f8f0e3', canvas.renderAll.bind(canvas));
                saveState();
            }
        });

        // Export
        document.getElementById('btn-export').addEventListener('click', exportImage);

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
            if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                    var active = canvas.getActiveObject();
                    if (active && !active.isEditing) {
                        canvas.remove(active);
                        canvas.renderAll();
                    }
                }
            }
        });

        // Canvas click for text tool
        canvas.on('mouse:down', function(opt) {
            if (currentTool === 'text' && !opt.target) {
                var pointer = canvas.getPointer(opt.e);
                var text = new fabric.IText('双击编辑', {
                    left: pointer.x,
                    top: pointer.y,
                    fontSize: 24,
                    fill: currentColor,
                    fontFamily: 'SimHei, sans-serif',
                    cornerColor: '#d32f2f',
                    cornerSize: 10,
                    transparentCorners: false
                });
                canvas.add(text);
                canvas.setActiveObject(text);
                canvas.renderAll();
                setTool('select');
            }
            if (currentTool === 'eraser' && opt.target) {
                canvas.remove(opt.target);
                canvas.renderAll();
            }
        });

        // Category toggle
        document.querySelectorAll('.category-header').forEach(function(header) {
            header.addEventListener('click', function() {
                var content = this.nextElementSibling;
                var icon = this.querySelector('i');
                content.classList.toggle('hidden');
                if (icon) icon.style.transform = content.classList.contains('hidden') ? 'rotate(-90deg)' : '';
            });
        });

        // Mobile menu
        var menuBtn = document.getElementById('mobile-menu-btn');
        var menu = document.getElementById('mobile-menu');
        if (menuBtn && menu) {
            menuBtn.addEventListener('click', function() {
                menu.classList.toggle('hidden');
                var icon = menuBtn.querySelector('i');
                icon.classList.toggle('fa-bars');
                icon.classList.toggle('fa-times');
            });
        }

        // Mobile sidebar toggle
        var sidebarToggle = document.getElementById('sidebar-toggle');
        var sidebar = document.getElementById('sidebar');
        if (sidebarToggle && sidebar) {
            sidebarToggle.addEventListener('click', function() {
                sidebar.classList.toggle('show');
            });
        }

        // Window resize
        window.addEventListener('resize', function() {
            var wrapper = document.getElementById('canvas-wrapper');
            var w = wrapper.clientWidth - 32;
            var h = wrapper.clientHeight - 32;
            canvas.setDimensions({ width: w, height: h });
            canvas.renderAll();
        });

        // Page transitions
        document.querySelectorAll('a[href]').forEach(function(link) {
            var href = link.getAttribute('href');
            if (href && href.endsWith('.html') && !href.startsWith('http') && !href.startsWith('#')) {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    document.body.classList.add('page-fading-out');
                    setTimeout(function() { window.location.href = href; }, 300);
                });
            }
        });
    }

    // ============================================
    // Initialize
    // ============================================
    window.addEventListener('load', function() {
        initCanvas();
        populateParts();
        bindEvents();
    });
    </script>
</body>
</html>
